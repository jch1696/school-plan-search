name: 포털에서 가져오기
# 폰 페이지의 "가져오기" 버튼이 이 워크플로를 실행한다 (workflow_dispatch).
# 정보공개포털을 검색해 docs/data.json에 새 문서를 추가하고 커밋한다.
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: 검색어
        required: true
      days:
        description: 기간(일)
        default: "365"

permissions:
  contents: write

concurrency:
  group: collect   # 동시에 두 번 눌러도 차례로 (push 충돌 방지)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      KEYWORD: ${{ inputs.keyword }}
      DAYS: ${{ inputs.days }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 포털 검색 → data.json
        run: python export_web.py collect "$KEYWORD" "$DAYS"
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "가져오기: $KEYWORD"
          git pull --rebase
          git push
