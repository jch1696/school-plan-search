name: 포털 접속 테스트
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 포털에서 '졸업식' 검색
        run: |
          python -c "
          import opengo, time
          t = time.time()
          total, rows = opengo.search('졸업식', days=30)
          print(f'총 {total}건, 1쪽 {len(rows)}건, {time.time()-t:.1f}초')
          for r in rows[:3]: print('-', r['date'], r['title'], r['school'])
          "
